# agterm chords for cc-agterm-remote. install.sh puts these, with @BIN@ filled
# in, between the cc-agterm-remote markers at the end of
# ~/.config/agterm/keymap.conf, and replaces that block on every install.
# They also show up by name in Navigate ▸ Custom Commands (ctrl+shift+O).
# With several servers the pickers span all of them, and a new session or shell
# asks which one; `cc-remote-attach --host <host> --new` skips the question.
command "Manage remote Claude Code sessions" cmd+shift+r  @BIN@/cc-remote-attach
command "New remote Claude Code session" cmd+shift+h  @BIN@/cc-remote-attach --new
command "Stop this remote Claude Code session" cmd+shift+k  @BIN@/cc-remote-attach --stop-pane "$AGT_SESSION_ID"
command "New remote shell session" cmd+shift+s  @BIN@/cc-remote-attach --shell
command "Paste image into remote session" cmd+shift+v  @BIN@/cc-remote-paste-image
command "Show image from selection" cmd+shift+i  @BIN@/cc-remote-show-image
command "Paste (image to Claude Code)" cmd+v  @BIN@/cc-remote-paste
