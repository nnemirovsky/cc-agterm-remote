# agterm chords for cc-agterm-remote. install.sh puts these, with @BIN@ and
# @NAME@ filled in, between the cc-agterm-remote markers at the end of
# ~/.config/agterm/keymap.conf, and replaces that block on every install.
# They also show up by name in Navigate ▸ Custom Commands (ctrl+shift+O).
command "Manage @NAME@ Claude Code sessions" cmd+shift+r  @BIN@/cc-remote-attach
command "New @NAME@ Claude Code session" cmd+shift+h  @BIN@/cc-remote-attach --new
command "Stop this @NAME@ Claude Code session" cmd+shift+k  @BIN@/cc-remote-attach --stop-pane "$AGT_SESSION_ID"
command "New @NAME@ shell session" cmd+shift+s  @BIN@/cc-remote-attach --shell
command "Paste image into @NAME@ session" cmd+shift+v  @BIN@/cc-remote-paste-image
command "Show image from selection" cmd+shift+i  @BIN@/cc-remote-show-image
command "Paste (image to Claude Code)" cmd+v  @BIN@/cc-remote-paste
